<style>*{box-sizing:border-box}body{margin:0;font:15px 'IBM Plex Sans Arabic',sans-serif;background:#f1f3f1;color:#222;padding-bottom:70px}#v{padding:12px;max-width:640px;margin:auto}.c{background:#fff;border:1px solid #ddd;border-right:5px solid #ccc;border-radius:12px;padding:12px;margin:10px 0}.r{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:6px 0}.q{font-size:17px;margin:6px 0}.b{background:#fff;border:1px solid #2e7d32;color:#2e7d32;border-radius:20px;padding:6px 12px;font:inherit}.b.ok{background:#2e7d32;color:#fff}.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}.hd button{border:0;background:#e8f5e9;border-radius:50%;width:36px;height:36px;font-size:18px}.n{text-align:center;color:#666}.p{background:#fff;border-radius:10px;padding:8px 10px;margin:6px 0}small{color:#666}label{display:block;margin:8px 0}input,select{width:100%;padding:8px;border:1px solid #ccc;border-radius:8px;font:inherit}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;padding:12px;border:0;background:0;font:inherit;color:#666}nav .on{color:#2e7d32;font-weight:600;border-top:3px solid #2e7d32}#rd{position:fixed;inset:0;background:#fffdf5;overflow:auto;padding:10px;z-index:9}#tx{font:24px/2.4 'Amiri Quran',serif;text-align:justify;padding:6px 4px 120px}.pg{text-align:center;font:13px 'IBM Plex Sans Arabic';color:#888;border-top:1px dashed #ccc;margin:10px 0}.sh{text-align:center;background:#e8f5e9;border-radius:8px;font-size:20px;margin:8px 0}.bs{text-align:center}.ay{cursor:pointer;border-radius:6px}.ay b{color:#2e7d32;font-weight:400;font-size:18px}.m1{background:#ffcdd2}.m2{background:#ffe0b2}.m3{background:#bbdefb}.m4{background:#e1bee7}.pl{outline:2px solid #2e7d32}#sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -4px 20px #0004;padding:14px;z-index:10}#ap{position:sticky;top:0;background:#fffdf5;z-index:2}[hidden]{display:none!important}h3{margin:14px 0 4px;color:#2e7d32}ol{padding-right:20px;line-height:1.9}.tc{text-align:center;flex:1}.bd{background:#2e7d32;color:#fff;border-radius:10px;padding:0 8px;font-size:12px}.sm{display:flex;gap:8px;margin:8px 0}.sm div{flex:1;background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 1px 3px #0001}.sm b{display:block;font-size:19px;color:#2e7d32}.bar{height:8px;background:#dfe5df;border-radius:8px;overflow:hidden;margin-bottom:6px}.bar i{display:block;height:100%;background:#2e7d32}.c{box-shadow:0 1px 3px #0001}.c.dn{opacity:.6}.ab{position:sticky;top:0;background:#fffdf5;z-index:2;display:flex;gap:8px;align-items:flex-end;padding:8px 0;border-bottom:1px solid #eee}.ab label{flex:1;font-size:12px;margin:0}.pbn{width:44px;height:44px;border-radius:50%;border:0;background:#2e7d32;color:#fff;font-size:18px}.fin{position:fixed;bottom:0;left:0;right:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#fffdf5ee;text-align:center}.fin .b{padding:10px 24px;font-size:16px}header{background:#2e7d32;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;font-weight:600;text-align:center}</style></head><body><header>وردي · متابعة الحفظ والمراجعة</header><div id=v></div><div id=rd hidden></div><div id=sheet hidden></div><nav><button data-t=t>اليوم</button><button data-t=p>الخطة</button><button data-t=m>المصحف</button><button data-t=s>الإعدادات</button></nav><script>
const NM="الفاتحة|البقرة|آل عمران|النساء|المائدة|الأنعام|الأعراف|الأنفال|التوبة|يونس|هود|يوسف|الرعد|إبراهيم|الحجر|النحل|الإسراء|الكهف|مريم|طه|الأنبياء|الحج|المؤمنون|النور|الفرقان|الشعراء|النمل|القصص|العنكبوت|الروم|لقمان|السجدة|الأحزاب|سبإ|فاطر|يس|الصافات|ص|الزمر|غافر|فصلت|الشورى|الزخرف|الدخان|الجاثية|الأحقاف|محمد|الفتح|الحجرات|ق|الذاريات|الطور|النجم|القمر|الرحمن|الواقعة|الحديد|المجادلة|الحشر|الممتحنة|الصف|الجمعة|المنافقون|التغابن|الطلاق|التحريم|الملك|القلم|الحاقة|المعارج|نوح|الجن|المزمل|المدثر|القيامة|الإنسان|المرسلات|النبأ|النازعات|عبس|التكوير|الانفطار|المطففين|الانشقاق|البروج|الطارق|الأعلى|الغاشية|الفجر|البلد|الشمس|الليل|الضحى|الشرح|التين|العلق|القدر|البينة|الزلزلة|العاديات|القارعة|التكاثر|العصر|الهمزة|الفيل|قريش|الماعون|الكوثر|الكافرون|النصر|المسد|الإخلاص|الفلق|الناس".split("|"),CN=[7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6],QS="1.1,2.26,2.44,2.60,2.75,2.92,2.106,2.124,2.142,2.158,2.177,2.189,2.203,2.219,2.233,2.243,2.253,2.263,2.272,2.283,3.15,3.33,3.52,3.75,3.93,3.113,3.133,3.153,3.171,3.186,4.1,4.12,4.24,4.36,4.58,4.74,4.88,4.100,4.114,4.135,4.148,4.163,5.1,5.12,5.27,5.41,5.51,5.67,5.82,5.97,5.109,6.13,6.36,6.59,6.74,6.95,6.111,6.127,6.141,6.151,7.1,7.31,7.47,7.65,7.88,7.117,7.142,7.156,7.171,7.189,8.1,8.22,8.41,8.61,9.1,9.19,9.34,9.46,9.60,9.75,9.93,9.111,9.122,10.11,10.26,10.53,10.71,10.90,11.6,11.24,11.41,11.61,11.84,11.108,12.7,12.30,12.53,12.77,12.101,13.5,13.19,13.35,14.10,14.28,15.1,15.49,16.1,16.30,16.51,16.75,16.90,16.111,17.1,17.23,17.50,17.70,17.99,18.17,18.32,18.51,18.75,18.99,19.22,19.59,20.1,20.55,20.83,20.111,21.1,21.29,21.51,21.83,22.1,22.19,22.38,22.60,23.1,23.36,23.75,24.1,24.21,24.35,24.53,25.1,25.21,25.53,26.1,26.52,26.111,26.181,27.1,27.27,27.56,27.82,28.12,28.29,28.51,28.76,29.1,29.26,29.46,30.1,30.31,30.54,31.22,32.11,33.1,33.18,33.31,33.51,33.60,34.10,34.24,34.46,35.15,35.41,36.28,36.60,37.22,37.83,37.145,38.21,38.52,39.8,39.32,39.53,40.1,40.21,40.41,40.66,41.9,41.25,41.47,42.13,42.27,42.51,43.24,43.57,44.17,45.12,46.1,46.21,47.10,47.33,48.18,49.1,49.14,50.27,51.31,52.24,53.26,54.9,55.1,56.1,56.75,57.16,58.1,58.14,59.11,60.7,62.1,63.4,65.1,66.1,67.1,68.1,69.1,70.19,72.1,73.20,75.1,76.19,78.1,80.1,82.1,85.1,87.1,90.1,94.1,100.9".split(",").map(x=>x.split(".").map(Number));
const OFF=[0];CN.forEach(c=>OFF.push(OFF[OFF.length-1]+c));
const ix=(s,a)=>OFF[s-1]+a-1,sa=i=>{let s=1;while(OFF[s]<=i)s++;return[s,i-OFF[s-1]+1]};
const endQ=q=>{if(q>=240)return[114,6];const[s,a]=QS[q];return a>1?[s,a-1]:[s-1,CN[s-2]]};
const rangeQ=(x,y)=>{const[s,a]=QS[x-1],[e,b]=endQ(y);return[s,a,e,b]};
const rtxt=r=>r[0]==r[2]?`${NM[r[0]-1]} (${r[1]} - ${r[3]})`:`${NM[r[0]-1]} ${r[1]} - ${NM[r[2]-1]} ${r[3]}`;
const DAYN=["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة"];
function gen(p,ov){const N=p.E-p.S+1,cum=[0],out={};
for(let d=1;d<=420;d++){const w=((d-1)/7|0)+1,k=(d-1)%7+1;
const eff=ov[d]!=null?ov[d]:(k<=p.md?p.qpd:0);
const nw=Math.max(0,Math.min(Math.floor(eff),N-cum[d-1]));cum[d]=cum[d-1]+nw;
const P=w==1?0:cum[(w-1)*7],ws=P+1,pv=cum[d-1],c=cum[d];
let act=P<N;for(let j=1;j<=7;j++)if(ov[(w-1)*7+j]!=null)act=true;if(!act)continue;
const ss=[],add=(t,n,a,b)=>{const q=p.asc?[p.S+a-1,p.S+b-1]:[p.E-b+1,p.E-a+1];ss.push({t,n,r:rangeQ(q[0],q[1])})};
if(nw>0&&pv>=ws)add("تثبيت","تثبيت القريب",ws,pv);
if(nw>0)add("حفظ","حفظ",pv+1,c);
if(p.rev&&k<=p.rd){const a=Math.floor(P*(k-1)/p.rd)+1,b=Math.floor(P*k/p.rd);if(b>=a)add("مراجعة","مراجعة القديم",a,b)}
if(k==6&&p.thu&&c>=ws)add("مراجعة","تسميع السند",ws,c);
if(k==7&&p.fri&&c>=1)add("مراجعة","تسميع القديم",1,c);
if(ss.length)out[d]={w,k,ss,c,N}}
return out}
//UI
const $=s=>document.querySelector(s),LS=localStorage,pad=n=>String(n).padStart(3,"0");
const lastSat=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+1)%7);return d.toISOString().slice(0,10)};
let st=JSON.parse(LS.st||"null")||{p:{S:1,E:240,asc:1,qpd:1,md:5,rev:1,thu:1,fri:1,rd:6},ov:{},start:lastSat(),done:{},mk:{},cal:{},ra:1,rr:1,srv:""};
const save=()=>LS.st=JSON.stringify(st);
let PL=gen(st.p,st.ov),D=null,tab="t",vd=null,au=new Audio(),stop=true,rd=null;
const dayNo=()=>Math.floor((new Date().setHours(0,0,0,0)-new Date(st.start+"T00:00"))/864e5)+1;
const dDate=d=>{const x=new Date(st.start+"T00:00");x.setDate(x.getDate()+(+d)-1);return x.toLocaleDateString("ar",{day:"numeric",month:"short"})};
const idb=(m,k,v)=>new Promise((ok,no)=>{const r=indexedDB.open("q",1);r.onupgradeneeded=()=>r.result.createObjectStore("s");r.onsuccess=()=>{const s=r.result.transaction("s",m).objectStore("s"),q=m=="readonly"?s.get(k):s.put(v,k);q.onsuccess=()=>ok(q.result);q.onerror=no};r.onerror=no});
async function data(){if(D)return D;let c=await idb("readonly","d").catch(()=>0);if(!c){const j=await(await fetch("https://api.alquran.cloud/v1/quran/quran-uthmani")).json(),t=[],p=[];j.data.surahs.forEach(s=>s.ayahs.forEach(a=>{let x=a.text;if(s.number!=1&&s.number!=9&&a.numberInSurah==1)x=x.replace(/^\S+\s+\S+\s+\S+\s+\S+\s+/,"");t.push(x);p.push(a.page)}));c={t,p};await idb("readwrite","d",c).catch(()=>0)}return D=c}
const ixr=r=>[ix(r[0],r[1]),ix(r[2],r[3])];
const pages=r=>{if(!D)return"";const[a,b]=ixr(r),x=D.p[a],y=D.p[b];return x==y?`ص ${x}`:`ص ${x}–${y}`};
const TC={"حفظ":"#2e7d32","تثبيت":"#1565c0","مراجعة":"#6a1b9a"};
function put(h){$("#v").innerHTML=h}
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));({t:vToday,p:vPlan,m:vMushaf,s:vSet})[tab]()}
function vToday(){const n=dayNo(),d=vd||Math.max(1,n),o=PL[d];let h=`<div class=hd><button onclick="vd=${d-1};render()">›</button><div class=tc><b>اليوم ${d}</b> · ${dDate(d)}<br><small>${o?DAYN[o.k-1]+" · أسبوع "+o.w:"بلا جلسات"}${d==n?" · <span class=bd>اليوم</span>":""}</small></div><button onclick="vd=${d+1};render()">‹</button></div>`;
if(d!=n&&n>=1)h+=`<div class=r><button class=b onclick="vd=null;render()">↩ العودة إلى اليوم</button></div>`;
if(n<1)h+=`<p class=n>تبدأ الخطة بتاريخ ${st.start}</p>`;
if(!o)h+=`<p class=n>لا توجد جلسات في هذا اليوم.</p>`;else{const dn=o.ss.filter((s,i)=>st.done[d+"_"+i]).length,pc=Math.round(o.c/o.N*100);h+=`<div class=sm><div><b>${dn}/${o.ss.length}</b><small>جلسات اليوم</small></div><div><b>${o.c}/${o.N}</b><small>أرباع محفوظة</small></div><div><b>${pc}%</b><small>من الخطة</small></div></div><div class=bar><i style="width:${pc}%"></i></div>`;
o.ss.forEach((s,i)=>{const k=d+"_"+i,x=st.done[k];h+=`<div class="c ${x?"dn":""}" style="border-right-color:${TC[s.t]}"><div class=r><b style="color:${TC[s.t]}">${s.n}</b><small>${s.t} ${pages(s.r)}</small></div><div class=q>${rtxt(s.r)}</div><div class=r><button class="b ${x?"ok":""}" onclick="tg('${k}')">${x?"✓ تم":"تم؟"}</button><button class=b onclick="openR(${d},${i})">📖 قراءة</button><button class=b onclick="openR(${d},${i},1)">🔊 استماع</button></div></div>`})}
if(!D)h+=`<div class=r><button class=b onclick="data().then(render).catch(()=>alert('تعذّر التحميل، تحقق من الاتصال'))">⬇ تحميل نص المصحف للعمل بلا إنترنت</button></div>`;
put(h);if(!D)data().then(()=>{if(tab=="t")render()}).catch(()=>{})}
const tg=k=>{st.done[k]=!st.done[k];save();render()};
function vPlan(){let h="",w=0;Object.keys(PL).forEach(d=>{const o=PL[d];if(o.w!=w){w=o.w;h+=`<h3>الأسبوع ${w}</h3>`}h+=`<div class=p onclick="vd=${d};tab='t';render()"><b>${d}</b> ${DAYN[o.k-1]} <small>${dDate(d)}</small><div>${o.ss.map(s=>`<i style="color:${TC[s.t]}">${s.n}</i>`).join(" · ")}</div></div>`});put(h||"<p class=n>لا خطة</p>")}
function vMushaf(){put(`<div class=c><b>تصفّح المصحف (مصحف المدينة، 604 صفحة)</b><div class=r><input id=pg type=number min=1 max=604 value=${LS.lp||1}><button class=b onclick="openP(+$('#pg').value)">فتح الصفحة</button></div></div><div class=c><b>الأخطاء المعلَّمة (${Object.keys(st.mk).length})</b><div id=ml></div></div>`);data().then(()=>{if(tab!="m")return;const L={1:"نسيان",2:"تردد",3:"لحن",4:"تشابه"};$("#ml").innerHTML=Object.keys(st.mk).map(i=>{const[s,a]=sa(+i);return`<div class=p onclick="openP(${D.p[i]})"><b>${NM[s-1]} ${a}</b> <small>${L[st.mk[i]]} · ص ${D.p[i]}</small></div>`}).join("")||"<small>لا علامات</small>"}).catch(()=>{})}
function vSet(){const p=st.p,f=(k,l,t="number")=>`<label>${l}<input data-k=${k} type=${t} value="${p[k]}"></label>`;
put(`<div class=c><b>ضبط الخطة (بالأرباع)</b>${f("S","ربع البداية")}${f("E","ربع النهاية")}<label>الترتيب<select data-k=asc><option value=1 ${p.asc?"selected":""}>تصاعدي<option value=0 ${p.asc?"":"selected"}>تنازلي</select></label>${f("qpd","أرباع الحفظ في اليوم")}${f("md","أيام الحفظ بالأسبوع")}${f("rd","أيام تقسيم المراجعة (1-6)")}<label>مراجعة يومية<select data-k=rev><option value=1 ${p.rev?"selected":""}>نعم<option value=0 ${p.rev?"":"selected"}>لا</select></label><label>تسميع الخميس<select data-k=thu><option value=1 ${p.thu?"selected":""}>نعم<option value=0 ${p.thu?"":"selected"}>لا</select></label><label>تسميع الجمعة<select data-k=fri><option value=1 ${p.fri?"selected":""}>نعم<option value=0 ${p.fri?"":"selected"}>لا</select></label><label>تاريخ بداية الخطة (يوم سبت)<input id=sd type=date value=${st.start}></label><button class=b onclick=ap()>حفظ وتطبيق</button></div>
<div class=c><b>تعديل يوم بعينه</b><div class=r><input id=od type=number placeholder="رقم اليوم"><input id=oq type=number placeholder="عدد الأرباع"><button class=b onclick=ao()>تعديل اليوم</button></div><small>${Object.keys(st.ov).map(d=>`يوم ${d}: ${st.ov[d]} <a onclick="delete st.ov[${d}];save();PL=gen(st.p,st.ov);render()">✕</a>`).join(" · ")||"لا تعديلات"}</small></div>
<div class=c><b>الصوت: الشيخ أحمد ديبان (حفص، حدر)</b><label>رابط خادم الملفات (اختياري)<input id=sv value="${st.srv}" placeholder="https://serverXX.mp3quran.net/deban/.../"></label><button class=b onclick="st.srv=$('#sv').value.trim();save()">حفظ</button></div>
<div class=c><b>النسخ الاحتياطي</b><small>بياناتك تُحفظ على هذا الجهاز فقط.</small><div class=r><button class=b onclick=bk()>⬆ تصدير نسخة</button><button class=b onclick="$('#rf').click()">⬇ استيراد نسخة</button><button class=b onclick=rs()>🗑 مسح الكل</button></div><input id=rf type=file accept=.json hidden onchange=ri(this)></div><div class=c><b>قواعد التفاعل مع الصفحة</b><ol><li>المس الآية لفتح العلامات.</li><li>🔴 نسيان: توقفتُ أو لُقّنتُ الآية.</li><li>🟠 تردد: أصبتُ بعد تردد أو تكرار.</li><li>🔵 لحن: خطأ في التشكيل أو الأداء.</li><li>🟣 تشابه: خلطتُ بآية مشابهة.</li><li>العلامات لتتبّع المواضع فقط، بلا درجات ولا نقاط.</li><li>أزل العلامة حين تثبت الآية.</li><li>للصوت: المس آية أثناء التشغيل ثم «ثبّت التوقيت» لضبط موضعها.</li></ol></div>`)}
function ap(){document.querySelectorAll("[data-k]").forEach(e=>st.p[e.dataset.k]=+e.value);st.start=$("#sd").value;st.p.rd=Math.min(6,Math.max(1,st.p.rd));save();PL=gen(st.p,st.ov);render()}
function ao(){const d=+$("#od").value,q=$("#oq").value;if(d>0&&q!==""){st.ov[d]=+q;save();PL=gen(st.p,st.ov);render()}}
function bk(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(st)],{type:"application/json"}));a.download="wird-backup-"+new Date().toISOString().slice(0,10)+".json";a.click()}
function ri(e){const f=e.files[0];if(!f)return;f.text().then(t=>{const x=JSON.parse(t);if(!x.p||!x.start)throw 0;if(confirm("استبدال بياناتك الحالية بالنسخة؟")){st=x;save();PL=gen(st.p,st.ov);render()}}).catch(()=>alert("ملف غير صالح"))}
function rs(){if(confirm("سيُمسح كل شيء (الخطة والعلامات والتقدّم). متأكد؟")){delete LS.st;location.reload()}}
// reader
async function openR(d,i,play){const s=PL[d].ss[i];await show(ixr(s.r),s.n+" — "+rtxt(s.r),play,0,d+"_"+i)}
async function openP(n){n=Math.min(604,Math.max(1,n||1));LS.lp=n;const o=$("#rd");o.hidden=false;if(!D){o.innerHTML="<p class=n>جارٍ تحميل نص المصحف…</p>";try{await data()}catch(e){o.hidden=true;return alert("تعذّر تحميل نص المصحف. تأكد من الاتصال.")}}await show([D.p.indexOf(n),D.p.lastIndexOf(n)],"صفحة "+n,0,n)}
async function show(r,title,play,pn,key){const o=$("#rd");o.hidden=false;if(!D){o.innerHTML="<p class=n>جارٍ تحميل نص المصحف…</p>";try{await data()}catch(e){o.hidden=true;return alert("تعذّر تحميل نص المصحف. تأكد من الاتصال أولاً.")}}
stp();rd={r,title,pn,key};o.scrollTop=0;o.innerHTML=`<div class=hd><button onclick=cl()>✕</button><b class=tc>${title}</b><span>${pn?`<button onclick="openP(${pn-1})">›</button><button onclick="openP(${pn+1})">‹</button>`:""}</span></div><div class=ab id=ap><button class=pbn id=pb onclick=pp()>▶</button><button class=pbn onclick=stp()>⏹</button><label>تكرار الآية<select onchange="st.ra=+this.value;save()">${[1,2,3,5,10].map(x=>`<option ${st.ra==x?"selected":""}>${x}`).join("")}</select></label><label>تكرار الورد<select onchange="st.rr=+this.value;save()">${[1,2,3,5,10].map(x=>`<option ${st.rr==x?"selected":""}>${x}`).join("")}</select></label></div><div id=tx></div>${key?`<div class=fin><button class="b ok" onclick="st.done['${key}']=true;save();cl()">✓ إنهاء الجلسة</button></div>`:""}`;draw();if(play)pp()}
function draw(){let h="",pg=0;for(let i=rd.r[0];i<=rd.r[1];i++){const[s,a]=sa(i);if(D.p[i]!=pg){pg=D.p[i];h+=`<div class=pg>— صفحة ${pg} —</div>`}if(a==1){h+=`<div class=sh>سورة ${NM[s-1]}</div>`+(s!=1&&s!=9?`<div class=bs>بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ</div>`:"")}h+=`<span class="ay m${st.mk[i]||0}" id=a${i} onclick=sh(${i})>${D.t[i]} <b>﴿${a}﴾</b></span> `}$("#tx").innerHTML=h}
function cl(){stp();$("#rd").hidden=true;$("#sheet").hidden=true;render()}
function sh(i){const[s,a]=sa(i),e=$("#sheet");e.hidden=false;e.innerHTML=`<b>${NM[s-1]} ${a}</b><div class=r>${[[1,"🔴 نسيان"],[2,"🟠 تردد"],[3,"🔵 لحن"],[4,"🟣 تشابه"]].map(x=>`<button class=b onclick="mk(${i},${x[0]})">${x[1]}</button>`).join("")}</div><div class=r><button class=b onclick="mk(${i},0)">إزالة العلامة</button><button class=b onclick="one(${i})">🔁 كرّر الآية</button><button class=b onclick="calb(${i})">ثبّت التوقيت</button><button class=b onclick="$('#sheet').hidden=true">إغلاق</button></div>`}
function mk(i,t){if(t)st.mk[i]=t;else delete st.mk[i];save();draw();$("#sheet").hidden=true}
// audio
async function srv(){if(st.srv)return st.srv;if(LS.srv)return LS.srv;const j=await(await fetch("https://www.mp3quran.net/api/v3/reciters?language=ar&reciter=265")).json(),m=j.reciters[0].moshaf.find(x=>/حفص|Hafs/.test(x.name))||j.reciters[0].moshaf[0];return LS.srv=m.server}
const load=async s=>{if(au.dataset.s==s)return;au.dataset.s=s;au.src=(await srv())+pad(s)+".mp3";await new Promise((ok,no)=>{au.onloadedmetadata=ok;au.onerror=()=>no("x")})};
function tms(s){const n=CN[s-1],w=[],b=s!=1&&s!=9?40:0;let c=b;const pos=[];for(let a=1;a<=n;a++){pos.push(c);c+=D.t[ix(s,a)].length+4}pos.push(c);const dur=au.duration,an=st.cal[s]||{},pts=[[0,0],[c,dur]];for(const a in an)pts.push([pos[a-1],an[a]]);pts.sort((x,y)=>x[0]-y[0]);const f=p=>{for(let k=1;k<pts.length;k++)if(p<=pts[k][0]||k==pts.length-1){const[x0,y0]=pts[k-1],[x1,y1]=pts[k];return x1==x0?y0:y0+(p-x0)/(x1-x0)*(y1-y0)}};return pos.map((p,k)=>k<n?[f(p),f(pos[k+1])]:0)}
let cur=0;
function seg(i){return new Promise(async ok=>{const[s,a]=sa(i);try{await load(s)}catch(e){alert("تعذّر تحميل الصوت. تحقق من الاتصال أو رابط الخادم في الإعدادات.");stop=true;return ok()}const t=tms(s)[a-1];cur=i;document.querySelectorAll(".pl").forEach(e=>e.classList.remove("pl"));const e=$("#a"+i);if(e){e.classList.add("pl");e.scrollIntoView({block:"center",behavior:"smooth"})}au.currentTime=t[0];au.play();const v=setInterval(()=>{if(stop||au.currentTime>=t[1]-.05||au.ended){clearInterval(v);au.pause();ok()}},80)})}
async function run(L,ra,rr){stop=false;$("#pb").textContent="⏸";for(let r=0;r<rr&&!stop;r++)for(const i of L)for(let x=0;x<ra&&!stop;x++)await seg(i);stop=true;$("#pb").textContent="▶"}
const lst=()=>{const L=[];for(let i=rd.r[0];i<=rd.r[1];i++)L.push(i);return L};
function pp(){if(!stop){stop=true;return}run(lst(),st.ra,st.rr)}
function stp(){stop=true;au.pause()}
function one(i){$("#sheet").hidden=true;stop=true;setTimeout(()=>run([i],Math.max(st.ra,3),1),150)}
function calb(i){const[s,a]=sa(i);if(au.dataset.s!=s||au.paused)return alert("شغّل صوت هذه السورة أولاً، ثم اضغط عند سماع الآية.");(st.cal[s]=st.cal[s]||{})[a]=au.currentTime;save();$("#sheet").hidden=true}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;vd=null;render()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
render();
</script></body></html>
